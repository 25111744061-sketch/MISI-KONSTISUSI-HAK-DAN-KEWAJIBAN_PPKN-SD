<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi Konstitusi: Pasangkan Hak dan Kewajibanku!</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8f4ff;--card:#fff;--tx:#1d2b4f;--mut:#51608a;--red:#d62839;--blue:#1e6fd9;--yel:#ffc928;--grn:#1fa75a;--bd:#c9d9f0;--okbg:#d9f7e4;--badbg:#ffe0e6;--selbg:#fff3c4;--bub:#fffbe8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a33;--card:#1c2a4d;--tx:#f1f5ff;--mut:#b5c3e6;--bd:#34487a;--okbg:#14502f;--badbg:#5a2431;--selbg:#5b4a10;--bub:#2b3558;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;background:linear-gradient(180deg,var(--bg),var(--card));color:var(--tx);min-height:100vh;font-size:18px;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:clamp(34px,8vw,64px);margin:6px 0;color:var(--red);letter-spacing:1px;text-shadow:2px 2px 0 var(--yel)}
h2{margin:6px 0;font-size:clamp(22px,4.5vw,32px)}
.c{text-align:center}
.panel{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;box-shadow:0 6px 0 rgba(30,111,217,.15),0 10px 24px rgba(0,0,0,.08);margin:12px 0}
.btn{font:inherit;font-weight:800;font-size:20px;min-height:54px;padding:10px 24px;border-radius:999px;border:0;cursor:pointer;color:#fff;background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.2);margin:6px;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.r{background:var(--red)}.btn.g{background:var(--grn)}.btn.y{background:var(--yel);color:#3a2b00}.btn.w{background:var(--card);color:var(--tx);border:3px solid var(--bd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{font-size:clamp(40px,10vw,70px);letter-spacing:6px}
.guide{display:flex;gap:12px;align-items:center;margin:8px 0}
.ava{flex:none;width:72px;height:72px;border-radius:50%;background:var(--red);border:4px solid #fff;display:grid;place-items:center;font-size:42px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.bub{background:var(--bub);border:3px solid var(--yel);border-radius:20px;padding:10px 14px;flex:1;font-weight:700}
.bub.ok{background:var(--okbg);border-color:var(--grn)}.bub.bad{background:var(--badbg);border-color:#ff8fa3}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--card);border:3px solid var(--bd);border-radius:999px;padding:4px 14px;font-weight:800}
.bar{height:18px;background:var(--bd);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yel),var(--grn));transition:width .5s}
.banner{background:var(--blue);color:#fff;border-radius:20px;padding:10px 16px;font-weight:900;font-size:clamp(20px,4vw,28px);display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media (max-width:700px){.grid{grid-template-columns:1fr}body{font-size:17px}}
.col h3{margin:4px 0 8px}
.card{position:relative;display:flex;gap:10px;align-items:center;width:100%;font:inherit;font-weight:700;text-align:left;color:var(--tx);background:var(--card);border:4px solid var(--bd);border-radius:20px;padding:12px;margin-bottom:10px;min-height:68px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.1);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px)}
.card .ic{font-size:34px;flex:none}
.card .n{flex:none;min-width:30px;height:30px;border-radius:50%;color:#fff;font-weight:900;display:grid;place-items:center;font-size:16px}
.card.sel{border-color:var(--yel);background:var(--selbg);transform:scale(1.03);box-shadow:0 0 0 5px rgba(255,201,40,.5)}
.card.ok{border-color:var(--grn);background:var(--okbg);cursor:default;transform:none}
.card.ok::after{content:"✅";position:absolute;right:10px;top:8px;font-size:24px}
.card.bad{border-color:#ff8fa3;background:var(--badbg);animation:shake .4s}
.card.pop{animation:pop .6s}
.card.pop::before{content:"⭐";position:absolute;right:12px;top:-6px;font-size:30px;animation:fly 1s forwards}
.card .pb{position:absolute;right:-8px;top:-10px;min-width:30px;height:30px;border-radius:50%;color:#fff;font-weight:900;display:grid;place-items:center;border:3px solid #fff}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{40%{transform:scale(1.08)}}
@keyframes fly{to{transform:translateY(-34px);opacity:0}}
@keyframes spin{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.big{font-size:60px;display:inline-block;animation:spin .7s}
ol.rules{padding-left:26px;font-weight:700}ol.rules li{margin:6px 0}
.acts{display:flex;flex-wrap:wrap;justify-content:center;margin-top:8px}
.lv{display:flex;justify-content:space-between;gap:8px;border-bottom:2px dashed var(--bd);padding:6px 0;font-weight:700}
textarea{width:100%;font:inherit;border:3px solid var(--bd);border-radius:16px;padding:10px;background:var(--card);color:var(--tx);min-height:80px}
.info{display:flex;gap:12px;align-items:flex-start}.info .ic{font-size:44px}
.done{background:var(--okbg);border-color:var(--grn)}
.mode{display:flex;justify-content:center;flex-wrap:wrap}
.mode .btn.on{background:var(--grn);color:#fff;border-color:var(--grn)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const COL=["#d62839","#1e6fd9","#1fa75a","#8e44ad","#e67e22"];
const D=[
{t:"KENALI KONSTITUSI!",env:"🏫 Sekolah",e:"Konstitusi adalah aturan dasar dalam penyelenggaraan negara. UUD NRI Tahun 1945 merupakan hukum dasar tertulis Negara Indonesia.",
 it:[["📜","Konstitusi","Aturan dasar yang menjadi pedoman penyelenggaraan negara."],["📖","UUD NRI Tahun 1945","Hukum dasar tertulis Negara Indonesia."],["🇮🇩","Negara Indonesia","Negara yang memiliki aturan dasar dalam kehidupan bernegara."],["⚖️","Fungsi konstitusi","Menjadi pedoman penyelenggaraan negara dan membatasi kekuasaan sesuai aturan."],["🤝","Kehidupan bernegara","Kehidupan bersama sebagai warga negara yang diatur oleh hukum dan aturan yang berlaku."]]},
{t:"TEMUKAN HAKMU!",env:"🏫 Kelas & Tempat Ibadah",e:"Hak adalah sesuatu yang berhak kita peroleh. Setiap anak memiliki hak yang harus dihati.",
 it:[["🧒📚","Anak mengikuti pembelajaran di sekolah","Hak memperoleh pendidikan."],["🕌⛪","Anak menjalankan ibadah sesuai agama dan kepercayaannya","Hak beragama dan beribadah."],["🧑‍🏫🛡️","Anak memperoleh perlindungan dari kekerasan","Hak atas perlindungan."],["🗣️💬","Anak menyampaikan pendapat dengan sopan","Hak menyampaikan pendapat sesuai ketentuan yang berlaku."],["👧🏽🧒🏻","Anak mendapatkan perlakuan yang sama di sekolah","Hak memperoleh perlakuan yang adil tanpa diskriminasi."]]},
{t:"APA KEWAJIBANMU?",env:"🌳 Taman & Sekolah",e:"Kewajiban adalah sesuatu yang harus dilakukan. Tanggung jawab berarti melaksanakan tugas dan kewajiban dengan baik. Ada kewajiban yang diatur dalam hukum, ada pula tanggung jawab sehari-hari di rumah dan sekolah.",
 it:[["✏️","Mengikuti pembelajaran","Belajar dengan sungguh-sungguh dan menaati aturan sekolah."],["🚏","Menggunakan fasilitas umum","Menjaga kebersihan dan tidak merusaknya."],["🏫","Berada di lingkungan sekolah","Menaati tata tertib sekolah."],["👫","Hidup bersama orang lain","Menghormati hak orang lain."],["🌿","Mendapatkan hak atas lingkungan yang bersih","Ikut menjaga kebersihan sesuai kemampuan dan aturan yang berlaku."]]},
{t:"PASANGKAN HAK DAN KEWAJIBAN!",env:"📚 Perpustakaan",e:"Hak dan kewajiban saling berkaitan. Kita perlu menggunakan hak dengan bertanggung jawab dan melaksanakan kewajiban tanpa mengabaikan hak orang lain. Pasangan tadi adalah contoh hubungan dalam kehidupan sehari-hari. Tidak semua hak punya satu kewajiban pasangan secara langsung.",
 it:[["📚","Hak menggunakan perpustakaan sekolah","Kewajiban menjaga buku dan menaati aturan perpustakaan."],["🪑","Hak belajar dengan nyaman","Tanggung jawab menjaga ketertiban kelas."],["🧹","Hak menikmati lingkungan yang bersih","Tanggung jawab ikut menjaga kebersihan lingkungan."],["🗣️","Hak menyampaikan pendapat","Tanggung jawab menghormati pendapat orang lain."],["⚽","Hak menggunakan fasilitas sekolah","Tanggung jawab menggunakan fasilitas dengan tertib dan menjaganya."]]},
{t:"PAHLAWAN WARGA NEGARA!",env:"🏘️ Lingkungan Masyarakat",e:"Warga negara yang baik menggunakan haknya, melaksanakan kewajibannya, menghormati orang lain, dan bertanggung jawab atas tindakannya.",
 it:[["🗑️","Kamu melihat sampah di halaman sekolah","Membuang sampah pada tempatnya."],["👂","Teman sedang menyampaikan pendapat","Mendengarkan dan menghargainya."],["📕","Kamu meminjam buku perpustakaan","Mengembalikan buku tepat waktu."],["🙋","Kamu mengikuti musyawarah kelas","Menampaikan pendapat dengan sopan dan menghormati keputusan bersama."],["🚌","Kamu menggunakan fasilitas umum","Menggunakannya dengan tertib dan menjaganya agar tetap baik."]]}
];
const MAT=[["📜","Apa itu konstitusi?","Konstitusi adalah aturan dasar untuk mengatur negara. Contoh: aturan agar negara dijalankan dengan adil."],["📖","Apa itu UUD NRI Tahun 1945?","UUD NRI Tahun 1945 adalah hukum dasar tertulis Negara Indonesia."],["🎁","Apa itu hak?","Hak adalah sesuatu yang berhak kita peroleh. Contoh: hak belajar di sekolah."],["✅","Apa itu kewajiban?","Kewajiban adalah sesuatu yang harus kita lakukan. Contoh: menaati tata tertib sekolah."],["🦸","Bagaimana cara menjadi warga negara yang bertanggung jawab?","Gunakan hakmu dengan baik, laksanakan kewajibanmu, hormati orang lain, dan pikirkan akibat tindakanmu."]];
const RING=["Konstitusi merupakan aturan dasar penyelenggaraan negara.","UUD NRI Tahun 1945 adalah hukum dasar tertulis Negara Indonesia.","Hak merupakan sesuatu yang berhak kita peroleh.","Kewajiban merupakan sesuatu yang harus kita lakukan.","Tanggung jawab berarti melaksanakan kewajiban dan mempertimbangkan akibat tindakan kita."];
const M={ok:"Hebat! Kamu sudah menemukan pasangan yang tepat!",no:"Belum tepat. Yuk, baca kembali situasinya dan coba lagi!",hint:"Ingat, hak adalah sesuatu yang berhak kita peroleh, sedangkan kewajiban adalah sesuatu yang harus kita lakukan.",lv:"Luar biasa! Kamu berhasil menyelesaikan misi ini!",all:"Selamat, Pahlawan Warga Negara! Kamu berhasil menuntaskan seluruh misi!"};
const $=document.getElementById("app");
let AC=null,MUTE=false;
const LINK_KUMPUL="";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function hasil(){const n=(S.name||"").trim()||"(tanpa nama)";return "Hasil Misi Konstitusi\nNama: "+n+"\nSkor: "+score()+"/250\nJawaban benar: "+solved()+"/25\nBintang: "+stars()+"/5\n"+D.map((d,i)=>"Level "+(i+1)+": "+S.done[i].length*10+"/50").join("\n")+"\nRefleksi: "+(S.reflect||"-")}
function softR(){const y=scrollY;$.innerHTML=result();scrollTo(0,y)}
function tone(f,t,d,type,v){const c=AC,o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v||.2,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.05)}
function sfx(k){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
const N={tick:[[600,0,.07,"triangle",.1]],ok:[[659,0,.15],[880,.12,.15],[1175,.24,.3]],no:[[330,0,.2,"triangle",.18],[262,.18,.3,"triangle",.18]],win:[[523,0,.15],[659,.15,.15],[784,.3,.15],[1047,.45,.5]]};
N[k].forEach(a=>tone(a[0],a[1],a[2],a[3],a[4]))}catch(e){}}
let S;
function init(keepMode){S={page:"home",mode:keepMode||"ind",lvl:0,done:[[],[],[],[],[]],order:[0,1,2,3,4],pairs:{},sel:null,att:0,msg:"",kind:"",bad:{q:[],a:[]},fresh:[],reflect:"",from:"home"}}
function shuf(){let a;do{a=[0,1,2,3,4];for(let i=4;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}while(a.every((v,i)=>v===i));return a}
const score=()=>S.done.reduce((s,d)=>s+d.length*10,0);
const stars=()=>S.done.filter(d=>d.length===5).length;
const solved=()=>S.done.reduce((s,d)=>s+d.length,0);
const isDone=q=>S.done[S.lvl].includes(q);
const free=()=>{for(let q=0;q<5;q++)if(!isDone(q)&&!(q in S.pairs))return q;return null};
const clr=()=>{S.bad={q:[],a:[]};S.fresh=[]};
function startLevel(l){S.lvl=l;S.done[l]=[];S.order=shuf();S.pairs={};S.sel=0;S.att=0;clr();S.msg=D[l].t==="KENALI KONSTITUSI!"?"Halo! Aku Kak Konsti. Pilih kartu soal, lalu pilih kartu jawaban yang cocok.":"Misi baru! Pilih kartu soal, lalu kartu jawaban yang cocok.";S.kind="";S.page="game"}
function check(){
 clr();const L=S.lvl,ks=Object.keys(S.pairs).map(Number).filter(q=>!isDone(q));
 if(!ks.length){S.msg="Pasangkan dulu minimal satu kartu soal dengan kartu jawaban ya!";S.kind="";return}
 const bad=[];
 ks.forEach(q=>{if(S.pairs[q]===q){S.done[L].push(q);S.fresh.push(q)}else{S.bad.q.push(q);S.bad.a.push(S.pairs[q]);bad.push(q)}delete S.pairs[q]});
 if(bad.length){sfx(S.fresh.length?"ok":"no");S.att++;S.msg=(S.fresh.length?"Ada yang sudah tepat! ":"")+M.no+(S.att>=2?" "+M.hint:"");S.kind="bad"}
 else sfx(S.done[L].length===5?"win":"ok"),S.kind="ok",S.msg=S.done[L].length===5?M.lv:M.ok;
 S.sel=free();
}
function hint(){
 clr();const un=[0,1,2,3,4].filter(q=>!isDone(q));if(!un.length)return;
 const q=(S.sel!=null&&!isDone(S.sel))?S.sel:un[0];S.sel=q;
 S.msg=`Petunjuk soal ${q+1}: jawabannya diawali “${D[S.lvl].it[q][2].split(" ").slice(0,3).join(" ")} …”. `+(S.att>=2?M.hint:"Baca situasinya pelan-pelan ya!");S.kind=""}
function pickQ(q){clr();if(isDone(q))return;S.sel=S.sel===q?null:q}
function pickA(a){clr();if(isDone(a))return;
 if(S.sel==null){S.msg="Pilih kartu soal dulu, lalu pilih kartu jawabannya.";S.kind="";return}
 for(const k in S.pairs)if(S.pairs[k]===a)delete S.pairs[k];
 S.pairs[S.sel]=a;S.sel=free();S.msg=S.sel==null?"Semua kartu sudah dipasangkan. Tekan “Periksa Jawaban”, atau ganti pilihanmu dulu.":"Bagus! Lanjutkan ke kartu soal berikutnya.";S.kind=""}

const stat=()=>`<div class="stats"><span class="chip">🎯 Level ${S.lvl+1}/5</span><span class="chip">🧩 Tantangan ${S.done[S.lvl].length}/5</span><span class="chip">🏅 Skor ${score()}</span><span class="chip">${"⭐".repeat(stars())||"☆"} ${stars()}/5</span></div><div class="bar"><i style="width:${solved()/25*100}%"></i></div>`;
const guide=(m,k)=>`<div class="guide"><div class="ava">🧑‍🎓</div><div class="bub ${k||""}"><b>Kak Konsti:</b> ${m}</div></div>`;

function home(){return `<div class="c"><div class="hero">🇮🇩📖🛡️⭐</div><h1>MISI KONSTITUSI</h1><h2>Pasangkan Hak dan Kewajibanku!</h2>
<div class="hero" style="letter-spacing:2px">🧑‍🎓👧🏽👦🏻👧🏿</div>${guide("Ayo, selesaikan misi dan jadilah warga negara yang baik!")}
<div class="panel"><b>5 Level • 25 Tantangan • Maksimal 250 Poin</b></div>
<div class="acts"><button class="btn g" data-act="go" data-p="rules">▶ MULAI BERMAIN</button><button class="btn y" data-act="go" data-p="rules">❓ CARA BERMAIN</button></div></div>`}
function rules(){return `<div class="panel"><h2 class="c">📋 Cara Bermain</h2><ol class="rules"><li>Baca kartu soal dengan teliti.</li><li>Pilih atau pasangkan kartu jawaban yang sesuai.</li><li>Tekan tombol “Periksa Jawaban”.</li><li>Setiap jawaban benar bernilai 10 poin.</li><li>Jawaban salah tidak mengurangi skor dan dapat diperbaiki.</li><li>Selesaikan 5 tantangan untuk mendapatkan 1 bintang pada setiap level.</li><li>Selesaikan seluruh 5 level untuk memperoleh maksimal 250 poin dan 5 bintang.</li></ol>
<div class="c"><b>Pilih mode bermain:</b></div><div class="mode"><button class="btn w ${S.mode==="ind"?"on":""}" data-act="mode" data-m="ind">🧍 Individu</button><button class="btn w ${S.mode==="grp"?"on":""}" data-act="mode" data-m="grp">👥 Kelompok</button></div>
${S.mode==="grp"?guide("Diskusikan jawaban bersama teman satu kelompok. Dengarkan pendapat setiap anggota dan sepakati jawaban sebelum memilih kartu."):""}
<div class="acts"><button class="btn w" data-act="go" data-p="home">⬅ Kembali</button><button class="btn r" data-act="start">🚀 MULAI MISI 1</button></div></div>`}
function game(){
 const L=S.lvl,d=D[L],fin=S.done[L].length===5;
 const qs=d.it.map((x,q)=>{const dn=isDone(q),b=S.bad.q.includes(q);
  return `<button class="card ${dn?"ok":""} ${S.sel===q&&!dn?"sel":""} ${b?"bad":""} ${S.fresh.includes(q)?"pop":""}" data-act="q" data-i="${q}" ${dn?"disabled":""}><span class="n" style="background:${COL[q]}">${q+1}</span><span class="ic">${x[0]}</span><span>${x[1]}</span></button>`}).join("");
 const as=S.order.map(a=>{const dn=isDone(a),b=S.bad.a.includes(a);let pq=null;for(const k in S.pairs)if(S.pairs[k]===a)pq=+k;
  return `<button class="card ${dn?"ok":""} ${b?"bad":""} ${S.fresh.includes(a)?"pop":""}" data-act="a" data-i="${a}" ${dn?"disabled":""} style="${pq!=null&&!dn?"border-color:"+COL[pq]:""}">${pq!=null&&!dn?`<span class="pb" style="background:${COL[pq]}">${pq+1}</span>`:""}<span>${d.it[a][2]}</span></button>`}).join("");
 return `<div class="banner"><span>Level ${L+1}: ${d.t}</span><span>${d.env}</span></div>${stat()}
${S.mode==="grp"?guide("Diskusikan jawaban bersama teman satu kelompok. Dengarkan pendapat setiap anggota dan sepakati jawaban sebelum memilih kartu."):""}
${guide(S.msg||"Pilih kartu soal.",S.kind)}
<div class="grid"><div class="col"><h3>❓ Kartu Soal</h3>${qs}</div><div class="col"><h3>💡 Kartu Jawaban</h3>${as}</div></div>
${fin?`<div class="panel done c"><span class="big">⭐</span><h2>${M.lv}</h2><p><b>${d.e}</b></p>${L===4?`<p><b>${M.all}</b></p>`:""}</div>`:""}
<div class="acts"><button class="btn w" data-act="go" data-p="home">⬅ Kembali</button><button class="btn y" data-act="hint" ${fin?"disabled":""}>💡 Petunjuk</button><button class="btn w" data-act="retry">🔄 Coba Lagi</button><button class="btn w" data-act="snd">${MUTE?"🔇":"🔊"} Suara</button>
${fin?(L<4?`<button class="btn g" data-act="next">Lanjut ke Level Berikutnya ➡</button>`:`<button class="btn g" data-act="result">🏆 Lihat Hasil Akhir</button>`):`<button class="btn r" data-act="check">✔ Periksa Jawaban</button>`}</div>`}
function result(){
 const p=score(),cat=p>=220?"Pahlawan Konstitusi Hebat!":p>=170?"Pejuang Hak dan Kewajiban!":"Penjelajah Konstitusi!";
 return `<div class="c"><div class="hero">🎉🧑‍🎓👧🏽👦🏻👧🏿🎉</div><h1>MISI SELESAI!</h1>${guide(M.all,"ok")}
<div class="panel"><div class="stats"><span class="chip">🏅 Skor ${p} / 250</span><span class="chip">✅ Benar ${solved()} / 25</span><span class="chip">⭐ Bintang ${stars()} / 5</span></div>
<h2 class="c" style="margin-top:12px">🏆 ${cat}</h2><p class="c">Selamat! Kamu sudah belajar dan berusaha dengan baik. Terus semangat ya!</p>
${D.map((d,i)=>`<div class="lv"><span>Level ${i+1}: ${d.t}</span><span>${S.done[i].length*10}/50 ${S.done[i].length===5?"⭐":"☆"}</span></div>`).join("")}</div>
<div class="panel" style="text-align:left"><h2>📝 Ringkasan Materi</h2><ol class="rules">${RING.map(r=>`<li>${r}</li>`).join("")}</ol>
<h3>💭 Refleksi</h3><p><b>Apa satu tindakan bertanggung jawab yang akan kamu lakukan mulai hari ini?</b></p><textarea id="ref" placeholder="Tulis jawabanmu di sini...">${S.reflect}</textarea></div>
<div class="panel"><h2>📤 Kumpulkan Hasil</h2><p>Tulis namamu, lalu salin hasilnya dan kirim ke gurumu.</p><input id="nm" value="${esc(S.name||"")}" placeholder="Nama kamu" style="width:100%;font:inherit;border:3px solid var(--bd);border-radius:16px;padding:10px;background:var(--card);color:var(--tx)"><div class="acts"><button class="btn y" data-act="copy">📋 Salin Hasil</button>${LINK_KUMPUL?`<a class="btn g" href="${LINK_KUMPUL}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">📨 Kirim ke Guru</a>`:""}</div>${S.out?`<p><b>Hasil siap! Jika belum tersalin otomatis, tekan teks di bawah lalu salin.</b></p><textarea readonly onclick="this.select()" style="min-height:170px">${esc(S.out)}</textarea>`:""}</div>
<div class="acts"><button class="btn r" data-act="again">🔁 Main Lagi</button><button class="btn y" data-act="mat">📚 Pelajari Materi</button></div></div>`}
function materi(){return `<div class="c"><h1 style="font-size:clamp(28px,6vw,44px)">📚 Pelajari Materi</h1></div>${MAT.map(m=>`<div class="panel info"><div class="ic">${m[0]}</div><div><h3 style="margin:0">${m[1]}</h3><p style="margin:4px 0 0">${m[2]}</p></div></div>`).join("")}
<div class="acts"><button class="btn w" data-act="go" data-p="${stars()===5?"result":"home"}">⬅ Kembali ${stars()===5?"ke Hasil":""}</button><button class="btn r" data-act="again">🔁 Main Lagi</button></div>`}
function render(){const P={home,rules,game,result,materi};$.innerHTML=P[S.page]();scrollTo(0,0)}
function soft(){const y=scrollY;$.innerHTML=game();scrollTo(0,y)}

$.addEventListener("click",e=>{
 const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const a=t.dataset.act,i=+t.dataset.i;
 switch(a){
  case"go":S.page=t.dataset.p;render();break;
  case"mode":S.mode=t.dataset.m;render();break;
  case"start":{const m=S.mode;init(m);startLevel(0);render();break}
  case"snd":MUTE=!MUTE;sfx("tick");soft();break;
  case"q":sfx("tick");pickQ(i);soft();break;
  case"a":sfx("tick");pickA(i);soft();break;
  case"check":check();soft();break;
  case"hint":hint();soft();break;
  case"retry":startLevel(S.lvl);render();break;
  case"next":if(S.done[S.lvl].length===5){startLevel(S.lvl+1);render()}break;
  case"result":if(stars()===5){S.page="result";render()}break;
  case"copy":S.out=hasil();try{navigator.clipboard.writeText(S.out)}catch(x){}softR();break;
  case"mat":S.page="materi";render();break;
  case"again":init(S.mode);S.page="rules";render();break;
 }});
$.addEventListener("input",e=>{if(e.target.id==="ref")S.reflect=e.target.value;if(e.target.id==="nm")S.name=e.target.value});
init();render();
</script>
</body>
</html>
